name: Build aria2 ARM64 OpenWrt

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3

      - name: Build aria2
        run: |
          docker run --rm -v $PWD:/src -w /src --platform linux/arm64 alpine:latest sh -c '
            apk add --no-cache build-base autoconf automake libtool pkgconf gettext-dev openssl-dev zlib-dev ca-certificates
            autoreconf -i
            ./configure --host=aarch64-linux-musl --disable-static --enable-shared --with-openssl
            make -j$(nproc)
            strip src/aria2c
          '

      - name: Upload release binary
        uses: softprops/action-gh-release@v2
        with:
          files: src/aria2c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
